function ui(){return onlineText[lang]}
function setStatus(message,error=false){const s=document.getElementById('syncStatus');if(s){s.textContent=message;s.className=error?'error':''}}
async function api(action,data){const response=await fetch('api.php?action='+action,{method:data?'POST':'GET',credentials:'same-origin',headers:data?{'Content-Type':'application/json','X-CSRF-Token':csrfToken}:{},body:data?JSON.stringify(data):undefined,cache:'no-store'});let result;try{result=await response.json()}catch{throw Error('server_error')}if(!response.ok)throw Error(result.error||'server_error');return result}
function errorMessage(e){return ui()[e.message]||ui().error}
function languageUI(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.getElementById('brandSub').textContent=translations[lang].brand;document.getElementById('footer').textContent=ui().secure}
function loginScreen(message=''){
languageUI();document.getElementById('account').innerHTML='';const u=ui();document.getElementById('app').innerHTML=`<article class="login"><div class="eyebrow">${translations[lang].eyebrow}</div><h1 style="font-size:36px">${u.login}</h1><p>${u.intro}</p><form id="loginForm"><label>${u.email}<input id="email" type="email" required autocomplete="username"></label><label>${u.password}<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" id="loginButton">${u.enter}</button></form><p id="loginError" role="status" class="error">${esc(message)}</p><button id="retry">${u.retry}</button></article>`;
document.getElementById('retry').onclick=boot;
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('loginButton');b.disabled=true;try{const me=await api('me');csrfToken=me.csrf;const r=await api('login',{email:document.getElementById('email').value,password:document.getElementById('password').value});user=r.user;csrfToken=r.csrf;await loadOnline();readonly=user.role!=='owner';render()}catch(error){document.getElementById('loginError').textContent=errorMessage(error)}finally{b.disabled=false}};
}
async function loadOnline(){const r=await api('load');weeks=r.weeks||initial();version=r.version;selected=Math.min(selected,weeks.length-1);dirty=false}
async function boot(){languageUI();document.getElementById('app').innerHTML='<p>'+ui().loading+'</p>';try{const r=await api('me');user=r.user;csrfToken=r.csrf;if(!user){loginScreen();return}await loadOnline();readonly=user.role!=='owner';render()}catch(e){loginScreen(errorMessage(e))}}
function render(){
if(!user){loginScreen();return}
const t=translations[lang],u=ui();t.local=u.liveNote;t.all=u.viewNote;t.published=u.viewer;t.print=u.export;
renderBase();document.getElementById('footer').textContent=u.secure;
document.getElementById('account').innerHTML=`<small>${esc(user.email)} · ${readonly?u.viewer:u.owner}<br><span id="syncStatus" role="status">${dirty?u.pending:u.saved}</span></small><div class="actions" style="margin:0"><button class="primary" id="allPDF">${u.pdf}</button><button id="logout">${u.logout}</button></div>`;
document.getElementById('allPDF').onclick=()=>printReports(false);
document.getElementById('print').onclick=()=>printReports(true);
document.getElementById('logout').onclick=async()=>{if((dirty||saving)&&!confirm(u.unsaved))return;clearTimeout(saveTimer);try{await api('logout',{});user=null;weeks=initial();dirty=false;loginScreen()}catch(e){setStatus(errorMessage(e),true)}};
if(!readonly){document.getElementById('save').onclick=saveOnline;const add=document.getElementById('add');if(weeks.length>=104){add.disabled=true;add.title=u.limit}document.querySelector('[data-key="hours"]').max=168;}
}
async function saveOnline(){if(user?.email==='demo@local'){notify('DEMO · Offline');return;}
if(readonly||!user||!dirty||saving)return;
if(!valid({version:1,weeks})||weeks.some(w=>Number(w.hours)>168||['live','repo'].some(k=>w[k]&&!safeLink(w[k])))){setStatus(ui().invalid_data,true);return}
clearTimeout(saveTimer);saving=true;setStatus(ui().saving);const snapshot=JSON.stringify(weeks);
try{const r=await api('save',{weeks:JSON.parse(snapshot),version});version=r.version;dirty=JSON.stringify(weeks)!==snapshot;setStatus(dirty?ui().pending:ui().saved);if(dirty)saveTimer=setTimeout(saveOnline,1000)}catch(e){setStatus(errorMessage(e),true)}finally{saving=false}
}
function printReports(single=false){
const t=translations[lang],u=ui();const list=single?[{w:weeks[selected],i:selected}]:weeks.map((w,i)=>({w,i}));
document.getElementById('printReport').innerHTML=list.map(({w,i})=>`<section class="pdf-week"><div class="eyebrow">HADIS · ${u.pdfTitle}</div><h2>${t.week} ${i+1} · ${esc(text(w,'title')||t.newTitle)}</h2><p>${date(w.start)} — ${date(shift(w.start,6))}</p><p>${t.due}: ${date(shift(w.start,6))}<br>${t.status}: ${t.statuses[w.status]} · ${t.time}: ${esc(w.hours||'0')}</p>${['tasks','learned','problems','prompts','next','other'].map(k=>`<div class="pdf-field"><h3>${t[k]}</h3>${esc(text(w,k)||t.empty)}</div>`).join('')}${['live','repo'].map(k=>`<div class="pdf-field"><h3>${t[k]}</h3>${safeLink(w[k])?`<a href="${esc(safeLink(w[k]))}">${esc(w[k])}</a>`:t.empty}</div>`).join('')}</section>`).join('');
document.body.classList.add('pdf-mode');notify(u.pdfNote);window.print();
}
window.addEventListener('afterprint',()=>{document.body.classList.remove('pdf-mode');document.getElementById('printReport').innerHTML=''});
window.addEventListener('beforeunload',e=>{if(dirty||saving){e.preventDefault();e.returnValue=''}});
document.getElementById('language').onchange=e=>{lang=e.target.value;render()};
/* Preview: no polling */ false && setInterval(async()=>{if(!user||dirty||saving||document.hidden)return;try{const r=await api('load');if(r.version!==version){weeks=r.weeks||initial();version=r.version;selected=Math.min(selected,weeks.length-1);render()}else setStatus(ui().saved)}catch(e){setStatus(errorMessage(e),true)}},15000);
user={email:"demo@local",role:"owner"};readonly=false;render();

</script></body></html>
